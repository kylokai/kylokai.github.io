<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>It's yayangggg birthdayy 💙💙</title>


<!-- ============================= -->
<!-- AMATIC SC FONT -->
<!-- ============================= -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
      rel="stylesheet">


<style>

/* ============================= */
/* RESET */
/* ============================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


/* ============================= */
/* BODY */
/* ============================= */

body {

    font-family: 'Amatic SC', cursive;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    color: white;

    position: relative;

}


/* ============================= */
/* VIDEO BACKGROUND */
/* ============================= */

#bg-video {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -3;

}


/* ============================= */
/* FIXED BACKGROUND FILTER */
/* ============================= */

/*
   IMPORTANT:
   filter sekarang FIXED.
   Jadi bila card / text muncul,
   background tak ikut bergerak.
*/

.overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    backdrop-filter:
        blur(6px)
        brightness(0.55);

    -webkit-backdrop-filter:
        blur(6px)
        brightness(0.55);

    background:
        rgba(100, 180, 255, 0.12);

    z-index: -2;

    pointer-events: none;

}


/* ============================= */
/* MAIN CONTENT */
/* ============================= */

.content {

    position: relative;

    text-align: center;

    width: 100%;

    max-width: 1200px;

    padding: 20px;

    z-index: 1;

}


/* ============================= */
/* MAIN TITLE */
/* ============================= */

h1 {

    animation: blink 1.5s infinite;

    font-size:
        clamp(28px, 5vw, 52px);

    line-height: 1.05;

    text-shadow:

        2px 2px 15px #8ed8ff,

        0 0 25px #bde9ff,

        0 0 45px rgba(130, 212, 255, 0.7);

    margin-bottom: 4px;

    margin-top: -20px;

    width: 100%;

}


/*
   Desktop:
   Keep birthday title in ONE LINE
*/

@media (min-width: 900px) {

    h1 {

        white-space: nowrap;

        font-size:
            clamp(32px, 4vw, 52px);

    }

}


/*
   Phone:
   Slightly smaller so it
   doesn't become too wide
*/

@media (max-width: 899px) {

    h1 {

        font-size:
            clamp(27px, 8vw, 40px);

        line-height: 1.05;

    }

}


@keyframes blink {

    0%, 100% {

        opacity: 1;

    }

    50% {

        opacity: 0.4;

    }

}


/* ============================= */
/* SUBTITLE */
/* ============================= */

p.subtitle {

    font-size:
        clamp(17px, 3.5vw, 22px);

    margin-bottom: 12px;

    line-height: 1.1;

    text-shadow:

        1px 1px 5px black,

        0 0 10px #8ed8ff;

}


/* ============================= */
/* BUTTON */
/* ============================= */

button {

    padding:
        10px 20px;

    font-family:
        'Amatic SC',
        cursive;

    font-weight: 700;

    font-size:
        clamp(17px, 4vw, 25px);

    background:
        #82d4ff;

    color: white;

    border:
        2px solid #c9f0ff;

    border-radius:
        12px;

    cursor: pointer;

    animation:
        blink 2s infinite;

    box-shadow:

        0 0 12px #bde9ff,

        0 0 25px
        rgba(130, 212, 255, 0.8);

    transition:
        0.25s;

}


button:hover {

    transform:
        scale(1.06);

    background:
        #a5e2ff;

    box-shadow:

        0 0 20px #d9f5ff,

        0 0 35px
        rgba(130, 212, 255, 0.9);

}


/* ============================= */
/* BOTTOM TEXT */
/* ============================= */

.bottom-text {

    margin-top: 18px;

    font-size:
        clamp(17px, 3.5vw, 23px);

    text-shadow:

        1px 1px 5px black,

        0 0 10px #8ed8ff;

}


/* ============================= */
/* ENVELOPE */
/* ============================= */

.envelope {

    width: 260px;

    height: 160px;

    background:
        #ffffff;

    border:
        3px solid #82d4ff;

    border-radius:
        12px;

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.1);

    opacity: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size:
        2.5rem;

    transition:
        0.7s ease;

    box-shadow:

        0 0 20px #9bddff,

        0 0 40px
        rgba(130, 212, 255, 0.7);

    z-index: 5;

}


.envelope.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1.25);

}


.envelope.pop-finish {

    transform:
        translate(-50%, -50%)
        scale(1);

}


.envelope.open {

    transform:
        translate(-50%, -50%)
        scale(1)
        rotateX(180deg);

}


/* ============================= */
/* CARD */
/* ============================= */

.card {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.2);

    background:

        linear-gradient(
            135deg,
            #82d4ff,
            #a9e3ff
        );

    color: white;

    width: 92%;

    max-width: 680px;

    max-height: 78vh;

    padding:
        30px 34px;

    opacity: 0;

    border-radius:
        25px;

    text-align: center;

    box-shadow:

        0 0 30px #d8f5ff,

        0 0 60px
        rgba(130, 212, 255, 0.7);

    transition:
        1s ease;

    z-index: 7;

    overflow-y: auto;

    overflow-x: hidden;

}


/* Card scrollbar */

.card::-webkit-scrollbar {

    width: 5px;

}


.card::-webkit-scrollbar-track {

    background:
        rgba(255,255,255,0.15);

    border-radius: 10px;

}


.card::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,0.6);

    border-radius: 10px;

}


.card.show {

    transform:
        translate(-50%, -50%)
        scale(1);

    opacity: 1;

}


/* ============================= */
/* TYPING TEXT */
/* ============================= */

/*
   IMPORTANT:
   border-right REMOVED.
   This was the white vertical line
   you saw on the right side.
*/

.typing {

    white-space:
        pre-wrap;

    overflow-wrap:
        break-word;

    word-wrap:
        break-word;

    display:
        block;

    width:
        100%;

    font-family:
        'Amatic SC',
        cursive;

    font-weight:
        700;

    font-size:
        clamp(18px, 3.8vw, 26px);

    line-height:
        1.45;

    letter-spacing:
        0.3px;

    text-shadow:

        1px 1px 3px
        rgba(0, 80, 130, 0.5);

}


/* ============================= */
/* FLOATING TEXT */
/* ============================= */

.float {

    position:
        fixed;

    font-family:
        'Amatic SC',
        cursive;

    font-weight:
        700;

    font-size:
        clamp(17px, 3.5vw, 23px);

    pointer-events:
        none;

    opacity:
        0;

    animation:

        floatRandom
        4.5s linear forwards,

        textPop
        0.5s ease;

    text-shadow:

        0 0 8px #8ed8ff,

        1px 1px 4px
        rgba(0, 60, 100, 0.8);

    z-index:
        3;

}


@keyframes floatRandom {

    0% {

        opacity:
            1;

        transform:
            translate(0, 0)
            scale(0.8);

    }

    100% {

        opacity:
            0;

        transform:
            translate(
                var(--xMove),
                var(--yMove)
            )
            scale(1.15);

    }

}


@keyframes textPop {

    0% {

        transform:
            scale(0.4);

    }

    100% {

        transform:
            scale(1);

    }

}


/* ============================= */
/* FLOATING IMAGES */
/* ============================= */

.float-img {

    position:
        fixed;

    width:
        100px;

    max-width:
        24vw;

    border-radius:
        15px;

    border:
        3px solid #a9e8ff;

    pointer-events:
        none;

    opacity:
        0;

    animation:

        floatRandomImg
        5.5s linear forwards,

        imgGlow
        1.5s ease-in-out
        infinite alternate;

    box-shadow:
        0 0 10px #8ed8ff;

    z-index:
        2;

}


@keyframes floatRandomImg {

    0% {

        opacity:
            1;

        transform:

            translate(0, 0)

            scale(0.85)

            rotate(0deg);

    }

    100% {

        opacity:
            0;

        transform:

            translate(
                var(--xMove),
                var(--yMove)
            )

            scale(1.15)

            rotate(var(--rotation));

    }

}


@keyframes imgGlow {

    0% {

        box-shadow:

            0 0 5px
            #8ed8ff;

    }

    100% {

        box-shadow:

            0 0 20px
            #e5f8ff;

    }

}


/* ============================= */
/* GLITTER */
/* ============================= */

.glitter {

    position:
        fixed;

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    pointer-events:
        none;

    animation:
        glitter 1s linear forwards;

    box-shadow:
        0 0 8px white;

    z-index:
        10;

}


@keyframes glitter {

    0% {

        transform:
            scale(0.3);

        opacity:
            1;

    }

    100% {

        transform:

            scale(2.5)

            translateY(-60px);

        opacity:
            0;

    }

}


/* ============================= */
/* MOBILE CARD */
/* ============================= */

@media (max-width: 600px) {

    body {

        padding:
            12px;

    }


    .content {

        padding:
            10px;

    }


    .card {

        width:
            91%;

        max-height:
            76vh;

        padding:
            24px 20px;

        border-radius:
            22px;

    }


    .typing {

        font-size:
            clamp(18px, 5vw, 23px);

        line-height:
            1.4;

    }


    .float-img {

        width:
            85px;

    }

}


/* ============================= */
/* VERY SMALL PHONES */
/* ============================= */

@media (max-width: 380px) {

    h1 {

        font-size:
            26px;

    }


    p.subtitle {

        font-size:
            17px;

    }


    button {

        font-size:
            19px;

        padding:
            9px 14px;

    }


    .card {

        padding:
            20px 16px;

    }


    .typing {

        font-size:
            17px;

        line-height:
            1.35;

    }

}

</style>

</head>


<body>


<!-- ============================= -->
<!-- BACKGROUND VIDEO -->
<!-- ============================= -->

<video
    id="bg-video"
    autoplay
    loop
    muted
    playsinline>

    <source
        src="her.mp4"
        type="video/mp4">

</video>


<!-- FIXED FILTER -->

<div class="overlay"></div>


<!-- ============================= -->
<!-- AUDIO -->
<!-- ============================= -->

<audio id="bg-music">

    <source
        src="birthday.mp3"
        type="audio/mp3">

</audio>


<!-- ============================= -->
<!-- MAIN CONTENT -->
<!-- ============================= -->

<div class="content">


    <h1>
        Hii yayangggg and happyy belated birthdayyy!!! 💙
    </h1>


    <p class="subtitle">
        ✨ made with love, a little bit of silliness, and a lot of thinking about youu ✨
    </p>


    <button id="main-btn">

        Openn it sayangg and hopee you enjoyy ittt &lt;33 💙

    </button>


    <p class="bottom-text">

        Enjoyy yourr speciall dayy sayanggg &lt;33 🩵

    </p>


</div>


<!-- ============================= -->
<!-- ENVELOPE -->
<!-- ============================= -->

<div
    class="envelope"
    id="envelope">

    💌

</div>


<!-- ============================= -->
<!-- BIRTHDAY CARD -->
<!-- ============================= -->

<div
    class="card"
    id="card">

    <span
        id="wish"
        class="typing">
    </span>

</div>


<script>


/* ============================= */
/* ELEMENTS */
/* ============================= */

const btn =
    document.getElementById(
        "main-btn"
    );


const envelope =
    document.getElementById(
        "envelope"
    );


const card =
    document.getElementById(
        "card"
    );


const wish =
    document.getElementById(
        "wish"
    );


const music =
    document.getElementById(
        "bg-music"
    );


/* ============================= */
/* FLOATING IMAGES */
/* ============================= */

/*
   5 pictures.

   Put all these files in the
   SAME folder as this HTML file.
*/

const floatingImages = [

    "sye.jpg",

    "sye1.jpg",

    "sye2.jpg",

    "sye3.jpg",

    "sye4.jpg"

];


/* ============================= */
/* BIRTHDAY MESSAGE */
/* ============================= */

/*
   The message is written like
   a natural message from a boyfriend.
*/

const message =

"🎉 Happy birthdayyy againn 🎉\n\n" +

"I just want you to know that having you in my life has changed so many things for me, in ways I probably never knew how to explain properly.\n\n" +

"Looking back at our journey, we've been through quite a lot together. We've had our happy moments, our silly moments, our arguments, and moments where things weren't exactly perfect. But somehow, through all of that, we're still here. And honestly, I'm really grateful for that.\n\n" +

"I know I'm not always the easiest person to deal with. I make mistakes, I say the wrong things sometimes, and there are definitely times when I mess things up. I'm far from perfect. But even after all those moments, you still chose to stay and chose me over and over again. And I don't think I'll ever take that for granted.\n\n" +

"Thank you for being patient with me, for understanding me, and for being someone I can share all the random little parts of my life with. You somehow became such a big part of my life without me even realizing it.\n\n" +

"And please, stop being so insecure about yourself okayy? You are genuinely beautiful. Not just because of how you look, but because of the way you care, the way you love, the way you laugh, and the little things that make you, you. I wish you could see yourself the way I see you sometimes.\n\n" +

"So on your birthday, I just hope you know how much you mean to me. I hope this year brings you more happiness, more peaceful days, more things to smile about, and hopefully less reasons to overthink everythinggg 😭💙\n\n" +

"Happy birthday once again, sayanggg. I'm really happy that our paths crossed, and I'm even happier that somehow, we get to continue this journey together. ❤️\n\n" +

"I love youu, always. Now go enjoy your birthdayyy, birthday girl 🩵🎂";


/* ============================= */
/* BUTTON CLICK */
/* ============================= */

btn.addEventListener(
    "click",
    () => {


    /* ============================= */
    /* PLAY MUSIC */
    /* ============================= */

    music.volume =
        0.9;

    music.play().catch(
        () => {}
    );


    /* ============================= */
    /* DISABLE BUTTON */
    /* ============================= */

    btn.disabled =
        true;

    btn.style.opacity =
        "0.4";


    /* ============================= */
    /* GLITTER */
    /* ============================= */

    for (
        let i = 0;
        i < 40;
        i++
    ) {


        let g =
            document.createElement(
                "div"
            );


        g.classList.add(
            "glitter"
        );


        g.style.left =
            (
                window.innerWidth / 2 +
                (
                    Math.random() * 240 -
                    120
                )
            ) + "px";


        g.style.top =
            (
                window.innerHeight / 2 +
                (
                    Math.random() * 120 -
                    60
                )
            ) + "px";


        const glitterColors = [

            "#ffffff",

            "#dff7ff",

            "#b8ecff",

            "#8edcff",

            "#c8f2ff"

        ];


        g.style.background =
            glitterColors[
                Math.floor(
                    Math.random() *
                    glitterColors.length
                )
            ];


        document.body.appendChild(
            g
        );


        setTimeout(
            () => g.remove(),
            1000
        );

    }


    /* ============================= */
    /* ENVELOPE */
    /* ============================= */

    envelope.classList.add(
        "show"
    );


    setTimeout(
        () => {

            envelope.classList.add(
                "pop-finish"
            );

        },
        300
    );


    /* ============================= */
    /* OPEN CARD */
    /* ============================= */

    setTimeout(
        () => {


            envelope.classList.add(
                "open"
            );


            card.classList.add(
                "show"
            );


            typeWriter();


            /*
               Floating text starts
               slowly so screen isn't messy.
            */

            setInterval(
                createFloatingText,
                1300
            );


            /*
               5 pictures available,
               but only one appears
               every 2.5 seconds.
            */

            setInterval(
                createFloatingImage,
                2500
            );


        },
        900
    );

});


/* ============================= */
/* TYPEWRITER */
/* ============================= */

let i = 0;


function typeWriter() {


    if (
        i <
        message.length
    ) {


        wish.innerHTML +=
            message.charAt(i);


        i++;


        setTimeout(
            typeWriter,
            35
        );

    }

}


/* ============================= */
/* FLOATING TEXT */
/* ============================= */

function createFloatingText() {


    const words = [


        "iloveyou forever and more than you ever think sayangg 🤍🤍",


        "🎉🎉🎉🎉",


        "may yourr dayyy be full of happiness sayanggg ✨",


        "don't be insecure sayangg, you're genuinely beautiful 💙",


        "you're more than enough sayangg 🩵",


        "it's myy bidadari duniaa birthdayyy 🌸",


        "you deserve all the happiness in the world sayanggg 💞",


        "stay prettyy sayanggg 🥹🩵",


        "thank you for choosing me over and over again 🤍",


        "our journey may not be perfect, but I wouldn't trade it for anything 💙"

    ];


    const el =
        document.createElement(
            "div"
        );


    el.classList.add(
        "float"
    );


    el.innerText =
        words[
            Math.floor(
                Math.random() *
                words.length
            )
        ];


    /* Random position */

    el.style.left =
        Math.random() * 75 +
        10 + "%";


    el.style.bottom =
        "-30px";


    /* Random movement */

    el.style.setProperty(

        "--xMove",

        (
            Math.random() * 300 -
            150
        ) + "px"

    );


    el.style.setProperty(

        "--yMove",

        (
            -300 -
            Math.random() * 200
        ) + "px"

    );


    document.body.appendChild(
        el
    );


    setTimeout(
        () => el.remove(),
        5000
    );

}


/* ============================= */
/* FLOATING IMAGES */
/* ============================= */

function createFloatingImage() {


    const img =
        document.createElement(
            "img"
        );


    /* Pick random picture */

    img.src =
        floatingImages[
            Math.floor(
                Math.random() *
                floatingImages.length
            )
        ];


    img.classList.add(
        "float-img"
    );


    /* Random starting position */

    img.style.left =
        Math.random() * 75 +
        10 + "%";


    img.style.bottom =
        "-70px";


    /* Random movement */

    img.style.setProperty(

        "--xMove",

        (
            Math.random() * 300 -
            150
        ) + "px"

    );


    img.style.setProperty(

        "--yMove",

        (
            -350 -
            Math.random() * 220
        ) + "px"

    );


    /* Random rotation */

    img.style.setProperty(

        "--rotation",

        (
            Math.random() * 30 -
            15
        ) + "deg"

    );


    document.body.appendChild(
        img
    );


    setTimeout(
        () => img.remove(),
        6000
    );

}


</script>


</body>

</html>
