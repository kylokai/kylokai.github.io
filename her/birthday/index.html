<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- Amatic SC Font -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
      rel="stylesheet">


<title>It's yayangggg birthdayy 💙💙</title>


<style>

/* ================================================= */
/* RESET */
/* ================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ================================================= */
/* BODY */
/* ================================================= */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    font-family: 'Amatic SC', cursive;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    color: white;

    position: relative;

    background: #6f8492;

}


/* ================================================= */
/* VIDEO BACKGROUND */
/* ================================================= */

#bg-video {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    object-fit: cover;

    z-index: -3;

    pointer-events: none;

}


/* ================================================= */
/* FIXED BLUE OVERLAY */
/* ================================================= */

/*
   IMPORTANT:

   Previously this was position:absolute.

   Now it is FIXED so the blur stays
   locked to the viewport and does not
   move when the page / mobile browser
   viewport changes.
*/

.overlay {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    background:
        rgba(55, 115, 150, 0.22);

    backdrop-filter:
        blur(7px)
        brightness(0.55);

    -webkit-backdrop-filter:
        blur(7px)
        brightness(0.55);

    z-index: -2;

    pointer-events: none;

}


/* ================================================= */
/* MAIN CONTENT */
/* ================================================= */

.content {

    position: relative;

    z-index: 2;

    text-align: center;

    width: 100%;

    max-width: 1200px;

    padding: 20px;

}


/* ================================================= */
/* MAIN TITLE */
/* ================================================= */

h1 {

    animation: blink 1.5s infinite;

    font-size:
        clamp(30px, 5vw, 58px);

    font-weight: 700;

    line-height: 1.05;

    letter-spacing: 1px;

    text-shadow:

        0 0 8px #8edcff,

        0 0 20px #8edcff,

        0 0 35px #c9f4ff;

    margin-bottom: 15px;

    width: 100%;

}


/* Desktop */

@media (min-width: 768px) {

    h1 {

        white-space: nowrap;

        font-size:
            clamp(34px, 4vw, 58px);

    }

}


/* Phone */

@media (max-width: 767px) {

    h1 {

        font-size:
            clamp(28px, 8vw, 42px);

        line-height: 1.05;

    }

}


@keyframes blink {

    0%,
    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.65;

    }

}


/* ================================================= */
/* SUBTITLE */
/* ================================================= */

p.subtitle {

    font-size:
        clamp(18px, 3vw, 25px);

    line-height: 1.2;

    margin-bottom: 18px;

    text-shadow:

        1px 1px 5px black,

        0 0 10px #8edcff;

}


/* ================================================= */
/* BUTTON */
/* ================================================= */

button {

    padding:
        12px 22px;

    font-family:
        'Amatic SC',
        cursive;

    font-size:
        clamp(18px, 4vw, 28px);

    font-weight: 700;

    background:
        linear-gradient(
            135deg,
            #82d4ff,
            #9fe1ff
        );

    color: white;

    border:
        2px solid #d8f6ff;

    border-radius: 12px;

    cursor: pointer;

    animation:
        blink 2s infinite;

    box-shadow:

        0 0 12px #bde9ff,

        0 0 25px
        rgba(130, 212, 255, 0.8);

    transition:
        0.25s ease;

}


button:hover {

    transform:
        scale(1.08);

    background:
        #a5e2ff;

    box-shadow:

        0 0 20px #d9f5ff,

        0 0 35px
        rgba(130, 212, 255, 0.9);

}


button:disabled {

    cursor: default;

}


/* ================================================= */
/* ENVELOPE */
/* ================================================= */

.envelope {

    width: 260px;
    height: 160px;

    background:
        #ffffff;

    border:
        3px solid #82d4ff;

    border-radius: 12px;

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.1);

    opacity: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 2.5rem;

    transition:
        0.7s ease;

    box-shadow:

        0 0 20px #9bddff,

        0 0 40px
        rgba(130, 212, 255, 0.7);

    z-index: 5;

}


.envelope.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1.25);

}


.envelope.pop-finish {

    transform:
        translate(-50%, -50%)
        scale(1);

}


.envelope.open {

    transform:
        translate(-50%, -50%)
        scale(1)
        rotateX(180deg);

}


/* ================================================= */
/* CARD */
/* ================================================= */

.card {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.2);

    background:

        linear-gradient(
            135deg,
            #82d4ff,
            #a9e3ff
        );

    color: white;

    width: min(90%, 520px);

    max-height: 82vh;
    max-height: 82svh;

    padding:
        clamp(22px, 5vw, 35px);

    opacity: 0;

    border-radius: 25px;

    text-align: center;

    box-shadow:

        0 0 30px #d8f5ff,

        0 0 60px
        rgba(130, 212, 255, 0.7);

    transition:
        1s ease;

    z-index: 7;

    overflow-y: auto;

}


/* Hide scrollbar */

.card::-webkit-scrollbar {

    width: 0;

}


.card.show {

    transform:
        translate(-50%, -50%)
        scale(1);

    opacity: 1;

}


/* ================================================= */
/* TYPING MESSAGE */
/* ================================================= */

.typing {

    display: block;

    border-right:
        2px solid white;

    white-space:
        pre-wrap;

    overflow-wrap:
        break-word;

    font-size:
        clamp(18px, 4vw, 26px);

    line-height:
        1.45;

    letter-spacing:
        0.5px;

    text-shadow:
        1px 1px 3px
        rgba(0, 80, 130, 0.5);

}


/* ================================================= */
/* FLOATING TEXT */
/* ================================================= */

.float {

    position: fixed;

    font-family:
        'Amatic SC',
        cursive;

    font-size:
        clamp(17px, 3.5vw, 25px);

    font-weight: 700;

    pointer-events: none;

    opacity: 0;

    z-index: 3;

    animation:

        floatRandom
        4.5s
        linear
        forwards,

        textPop
        0.5s
        ease;

    text-shadow:

        0 0 8px #8ed8ff,

        1px 1px 4px
        rgba(0, 60, 100, 0.8);

}


@keyframes floatRandom {

    0% {

        opacity: 1;

        transform:
            translate(0, 0)
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--xMove),
                var(--yMove)
            )
            scale(1.3);

    }

}


@keyframes textPop {

    0% {

        transform:
            scale(0.4);

    }

    100% {

        transform:
            scale(1);

    }

}


/* ================================================= */
/* FLOATING IMAGES */
/* ================================================= */

.float-img {

    position: fixed;

    width:
        clamp(75px, 17vw, 105px);

    max-width: 105px;

    border-radius: 15px;

    border:
        3px solid #a9e8ff;

    pointer-events: none;

    opacity: 0;

    z-index: 3;

    animation:

        floatRandomImg
        5.5s
        linear
        forwards,

        imgGlow
        1.5s
        ease-in-out
        infinite
        alternate;

}


@keyframes floatRandomImg {

    0% {

        opacity: 1;

        transform:
            translate(0, 0)
            scale(1)
            rotate(0deg);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--xMove),
                var(--yMove)
            )
            scale(1.25)
            rotate(var(--rotation));

    }

}


@keyframes imgGlow {

    0% {

        box-shadow:
            0 0 5px #8ed8ff;

    }

    100% {

        box-shadow:
            0 0 20px #e5f8ff;

    }

}


/* ================================================= */
/* GLITTER */
/* ================================================= */

.glitter {

    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 4;

    animation:

        glitter
        1s
        linear
        forwards;

    box-shadow:
        0 0 8px white;

}


@keyframes glitter {

    0% {

        transform:
            scale(0.3);

        opacity: 1;

    }

    100% {

        transform:
            scale(2.5)
            translateY(-60px);

        opacity: 0;

    }

}


/* ================================================= */
/* SMALL PHONE ADJUSTMENT */
/* ================================================= */

@media (max-width: 480px) {

    body {

        padding: 12px;

    }

    .content {

        padding: 10px;

    }

    p.subtitle {

        font-size: 19px;

    }

    button {

        padding:
            10px 16px;

        font-size: 21px;

    }

    .card {

        width: 88%;

        max-height: 78svh;

        padding:
            22px 18px;

        border-radius: 22px;

    }

    .typing {

        font-size: 20px;

        line-height: 1.4;

    }

}


/* ================================================= */
/* VERY SMALL PHONE */
/* ================================================= */

@media (max-width: 360px) {

    h1 {

        font-size: 27px;

    }

    p.subtitle {

        font-size: 17px;

    }

    button {

        font-size: 19px;

    }

    .typing {

        font-size: 18px;

    }

}


/* ================================================= */
/* REDUCE MOTION IF DEVICE REQUESTS IT */
/* ================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;

    }

}

</style>

</head>


<body>


<!-- ================================================= -->
<!-- BACKGROUND VIDEO -->
<!-- ================================================= -->

<video
    id="bg-video"
    autoplay
    loop
    muted
    playsinline>

    <source
        src="her.mp4"
        type="video/mp4">

</video>


<!-- FIXED OVERLAY -->

<div class="overlay"></div>


<!-- ================================================= -->
<!-- AUDIO -->
<!-- ================================================= -->

<audio
    id="bg-music">

    <source
        src="birthday.mp3"
        type="audio/mp3">

</audio>


<!-- ================================================= -->
<!-- MAIN CONTENT -->
<!-- ================================================= -->

<div class="content">


    <h1>

        Hii yayangggg and happyy belated birthdayyy!!! 💙

    </h1>


    <p class="subtitle">

        ✨ Made with love, a little bit of stupidity, and a lot of love for you ✨

    </p>


    <button id="main-btn">

        Openn it sayangg and hopee you enjoyy ittt &lt;33 💙

    </button>


    <p style="margin-top:30px; font-size:22px;">

        Enjoyy yourr speciall dayy sayanggg &lt;33 🩵

    </p>


</div>


<!-- ================================================= -->
<!-- ENVELOPE -->
<!-- ================================================= -->

<div
    class="envelope"
    id="envelope">

    💌

</div>


<!-- ================================================= -->
<!-- CARD -->
<!-- ================================================= -->

<div
    class="card"
    id="card">

    <span
        id="wish"
        class="typing">
    </span>

</div>


<script>


/* ================================================= */
/* ELEMENTS */
/* ================================================= */

const btn =
    document.getElementById("main-btn");

const envelope =
    document.getElementById("envelope");

const card =
    document.getElementById("card");

const wish =
    document.getElementById("wish");

const music =
    document.getElementById("bg-music");


/* ================================================= */
/* FLOATING IMAGES */
/* ================================================= */

/*
   5 pictures.

   Make sure all files are in
   the SAME folder as this HTML file.
*/

const floatingImages = [

    "sye.jpg",

    "sye1.jpg",

    "sye2.jpg",

    "sye3.jpg",

    "sye4.jpg"

];


/* ================================================= */
/* BIRTHDAY MESSAGE */
/* ================================================= */

const message =

"🎉 Happy birthdayyy againn 🎉\n\n" +

"I just want you to know that having you in my life has changed so many things for me, in ways I probably never knew how to explain properly.\n\n" +

"Looking back at our journey, we've been through quite a lot together. We've had our happy moments, our silly moments, our arguments, and moments where things weren't exactly perfect. But somehow, through everything, we're still here. And honestly, I'm really grateful for that. 💙\n\n" +

"I know I'm far from perfect, and I know I've made my fair share of mistakes. Sometimes I say the wrong things, do the wrong things, or make things harder than they need to be. But one thing that always means so much to me is that, even after all that, you still choose me over and over again.\n\n" +

"Thank you for staying, for understanding me, and for giving us chances even when I probably didn't deserve them. I may not always know how to show it properly, but I really do appreciate you more than you know. 🥹💙\n\n" +

"And please, don't be too insecure about yourself, okay? You are genuinely so pretty. I hope one day you can see yourself the way I see you, because sometimes I really don't understand how you can look at yourself and still think you're not pretty. 😭💙\n\n" +

"You deserve to feel loved, appreciated, and beautiful, not only on your birthday but every day.\n\n" +

"I hope this new chapter of your life brings you more happiness, more good memories, and more reasons to smile. And hopefully, I get to be there for many more of those moments with you. 🌸\n\n" +

"Happy birthday once again, sayanggg. Thank you for being you, and thank you for being part of my life. I love youu. 💙🩵";


/* ================================================= */
/* BUTTON CLICK */
/* ================================================= */

btn.addEventListener("click", () => {


    /* ============================================= */
    /* MUSIC */
    /* ============================================= */

    music.volume = 0.9;

    music.play().catch(() => {});


    /* ============================================= */
    /* DISABLE BUTTON */
    /* ============================================= */

    btn.disabled = true;

    btn.style.opacity = "0.4";


    /* ============================================= */
    /* GLITTER */
    /* ============================================= */

    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const g =
            document.createElement("div");

        g.classList.add("glitter");


        g.style.left =

            (
                window.innerWidth / 2 +

                (
                    Math.random() *
                    240 -
                    120
                )

            ) + "px";


        g.style.top =

            (
                window.innerHeight / 2 +

                (
                    Math.random() *
                    120 -
                    60
                )

            ) + "px";


        const glitterColors = [

            "#ffffff",
            "#dff7ff",
            "#b8ecff",
            "#8edcff",
            "#c8f2ff"

        ];


        g.style.background =

            glitterColors[
                Math.floor(
                    Math.random() *
                    glitterColors.length
                )
            ];


        document.body.appendChild(g);


        setTimeout(
            () => g.remove(),
            1000
        );

    }


    /* ============================================= */
    /* ENVELOPE */
    /* ============================================= */

    envelope.classList.add("show");


    setTimeout(
        () => {

            envelope.classList.add(
                "pop-finish"
            );

        },
        300
    );


    /* ============================================= */
    /* OPEN ENVELOPE */
    /* ============================================= */

    setTimeout(() => {


        envelope.classList.add("open");


        card.classList.add("show");


        typeWriter();


        /*
           Floating text:
           Every 1.3 seconds
        */

        setInterval(
            createFloatingText,
            1300
        );


        /*
           Floating images:
           Every 2.5 seconds
           to prevent overcrowding
        */

        setInterval(
            createFloatingImage,
            2500
        );


    }, 900);

});


/* ================================================= */
/* TYPEWRITER */
/* ================================================= */

let i = 0;


function typeWriter() {


    if (i < message.length) {


        wish.innerHTML +=

            message.charAt(i);


        i++;


        setTimeout(
            typeWriter,
            35
        );


    }

}


/* ================================================= */
/* FLOATING TEXT */
/* ================================================= */

function createFloatingText() {


    const words = [

        "iloveyou forever and more than you ever think sayangg 🤍🤍",

        "🎉🎉🎉🎉",

        "may yourr dayyy be full of happiness sayanggg ✨",

        "don't be insecure sayangg, you're so pretty 💙💙",

        "you're more than enough sayangg 🩵",

        "myy bidadari duniaa birthdayyy 🌸",

        "you deserve all the happinesss in the world 💞",

        "stay prettyy sayanggg 🥹🩵",

        "thank you for always choosing me 💙",

        "another year of being my favourite person hehe 🤭"

    ];


    const el =
        document.createElement("div");


    el.classList.add("float");


    el.innerText =

        words[
            Math.floor(
                Math.random() *
                words.length
            )
        ];


    /* Random position */

    el.style.left =

        Math.random() * 80 + "%";


    el.style.bottom =

        "-30px";


    /* Random movement */

    el.style.setProperty(

        "--xMove",

        (
            Math.random() *
            300 -
            150
        ) + "px"

    );


    el.style.setProperty(

        "--yMove",

        (
            -300 -
            Math.random() *
            200
        ) + "px"

    );


    document.body.appendChild(el);


    setTimeout(
        () => el.remove(),
        5000
    );

}


/* ================================================= */
/* FLOATING IMAGES */
/* ================================================= */

function createFloatingImage() {


    const img =
        document.createElement("img");


    /* Random picture */

    img.src =

        floatingImages[
            Math.floor(
                Math.random() *
                floatingImages.length
            )
        ];


    img.classList.add(
        "float-img"
    );


    /* Random starting position */

    img.style.left =

        Math.random() * 82 + "%";


    img.style.bottom =

        "-70px";


    /* Random movement */

    img.style.setProperty(

        "--xMove",

        (
            Math.random() *
            300 -
            150
        ) + "px"

    );


    img.style.setProperty(

        "--yMove",

        (
            -350 -
            Math.random() *
            220
        ) + "px"

    );


    /* Random rotation */

    img.style.setProperty(

        "--rotation",

        (
            Math.random() *
            30 -
            15
        ) + "deg"

    );


    document.body.appendChild(img);


    setTimeout(
        () => img.remove(),
        6000
    );

}


</script>


</body>

</html>
